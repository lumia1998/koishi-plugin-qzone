plugins:
  qzone:
    authMode: auto
    botId: ''
    manualCookie: ''
    onebotHttpUrl: ''
    onebotAccessToken: ''
    allowInsecureOnebotHttp: false
    cookieTtlSeconds: 600
    timeoutMs: 10000
    defaultFeedCount: 5
    maxImageBytes: 8388608
    maxImages: 9
    allowedImageHosts:
      - '*.qpic.cn'
      - '*.qlogo.cn'
      - '*.qq.com'
      - '*.gtimg.cn'
    commandAuthority: 1
    adminAuthority: 3
    autoCommentCron: ''
    autoCommentText: ''
    autoLikeWithComment: true
    autoPublishCron: ''
    autoPublishText: ''
    cronTimezone: Asia/Shanghai
    randomOffsetSeconds: 0
